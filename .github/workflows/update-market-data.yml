name: Update market data

on:
  schedule:
    # 北京时间工作日 18:23、22:23 收盘后抓取，错开整点拥堵。
    - cron: "23 10,14 * * 1-5"
    # 北京时间周二至周六 07:23 补抓上一个交易日，覆盖周五收盘。
    - cron: "23 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest market snapshot
        run: python fetch_data.py

      - name: Commit changed snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Snapshot is already current."
          else
            git commit -m "data: update market snapshot"
            git push
          fi
